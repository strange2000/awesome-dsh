<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="awesome-dsh — a field map of the DeepSeek Harness plugin ecosystem">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101a25"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC','Microsoft YaHei',sans-serif}
      .m{font-family:'SF Mono',ui-monospace,Consolas,monospace}
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="url(#bg)" stroke="#30363d"/>
  <rect x="40" y="56" width="6" height="86" rx="3" fill="url(#acc)"/>

  <text class="t" x="66" y="98" font-size="46" font-weight="700" fill="#e6edf3">awesome-dsh</text>
  <text class="t" x="66" y="140" font-size="18" fill="#8b949e">A field map of the DeepSeek Harness plugin ecosystem.</text>
  <text class="t" x="66" y="172" font-size="17" fill="#8b949e">DSH 插件生态的实况地图：<tspan fill="#58a6ff">坑长什么样</tspan>，以及怎么在十分钟内确认你有没有踩。</text>

  <g class="m" font-size="14">
    <rect x="66" y="212" width="132" height="36" rx="18" fill="#161b22" stroke="#30363d"/>
    <text x="132" y="235" fill="#58a6ff" text-anchor="middle">6 patterns</text>
    <rect x="210" y="212" width="128" height="36" rx="18" fill="#161b22" stroke="#30363d"/>
    <text x="274" y="235" fill="#3fb950" text-anchor="middle">10 checks</text>
    <rect x="350" y="212" width="122" height="36" rx="18" fill="#161b22" stroke="#30363d"/>
    <text x="411" y="235" fill="#d29922" text-anchor="middle">21 issues</text>
    <rect x="484" y="212" width="128" height="36" rx="18" fill="#161b22" stroke="#30363d"/>
    <text x="548" y="235" fill="#8b949e" text-anchor="middle">EN / 中文</text>
  </g>

  <!-- right side: six pattern keys -->
  <g class="m" font-size="13">
    <line x1="700" y1="72" x2="700" y2="252" stroke="#30363d"/>
    <text x="736" y="88"  fill="#8b949e">01 <tspan fill="#e6edf3">shared id</tspan>      没有契约</text>
    <text x="736" y="122" fill="#8b949e">02 <tspan fill="#e6edf3">silent</tspan>         读不到当没有</text>
    <text x="736" y="156" fill="#8b949e">03 <tspan fill="#e6edf3">rollback</tspan>       版本确认不了</text>
    <text x="736" y="190" fill="#8b949e">04 <tspan fill="#e6edf3">hard paths</tspan>     硬编码宿主布局</text>
    <text x="736" y="224" fill="#8b949e">05 <tspan fill="#e6edf3">unbounded</tspan>      有键却不指向</text>
    <text x="736" y="258" fill="#8b949e">06 <tspan fill="#e6edf3">dual truth</tspan>     白名单 vs 默认值</text>
  </g>
</svg>
