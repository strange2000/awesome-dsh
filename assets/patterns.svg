<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="six recurring defect patterns in DSH plugins">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101a25"/>
    </linearGradient>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC','Microsoft YaHei',sans-serif}
      .m{font-family:'SF Mono',ui-monospace,Consolas,monospace}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="499" rx="18" fill="url(#bg)" stroke="#30363d"/>
  <text class="t" x="56" y="56" font-size="26" font-weight="700" fill="#e6edf3">Six recurring defect patterns</text>
  <text class="t" x="56" y="84" font-size="15" fill="#8b949e">六类可复用的缺陷模式 —— 每一类都能在一条命令内判定，修法都不改变产品语义。</text>
  <g>
    <rect x="56" y="104" width="360" height="168" rx="14" fill="#161b22" stroke="#30363d"/>
    <text class="m" x="76" y="138" font-size="15" fill="#2f81f7">01</text>
    <text class="m" x="112" y="138" font-size="15" fill="#e6edf3">shared id</text>
    <text class="t" x="76" y="170" font-size="16" font-weight="600" fill="#e6edf3">共享注册 id 没有契约</text>
    <text class="t" x="76" y="198" font-size="13" fill="#8b949e">两个插件抢同一个 settings.section id</text>
    <text class="t" x="76" y="252" font-size="12.5" fill="#3fb950">判据 · 扫 id 集合，不看 order</text>
  </g>
  <g>
    <rect x="440" y="104" width="360" height="168" rx="14" fill="#161b22" stroke="#30363d"/>
    <text class="m" x="460" y="138" font-size="15" fill="#2f81f7">02</text>
    <text class="m" x="496" y="138" font-size="15" fill="#e6edf3">silent</text>
    <text class="t" x="460" y="170" font-size="16" font-weight="600" fill="#e6edf3">静默降级</text>
    <text class="t" x="460" y="198" font-size="13" fill="#8b949e">读不到当作没有，写不进当作没改，数不到当作 0</text>
    <text class="t" x="460" y="252" font-size="12.5" fill="#3fb950">判据 · 解析失败处有没有计数上报</text>
  </g>
  <g>
    <rect x="824" y="104" width="360" height="168" rx="14" fill="#161b22" stroke="#30363d"/>
    <text class="m" x="844" y="138" font-size="15" fill="#2f81f7">03</text>
    <text class="m" x="880" y="138" font-size="15" fill="#e6edf3">rollback</text>
    <text class="t" x="844" y="170" font-size="16" font-weight="600" fill="#e6edf3">热重载确认不了版本</text>
    <text class="t" x="844" y="198" font-size="13" fill="#8b949e">装好、校验通过、写盘成功，却因为旧代码还在跑而撤</text>
    <text class="t" x="844" y="218" font-size="13" fill="#8b949e">销</text>
    <text class="t" x="844" y="252" font-size="12.5" fill="#3fb950">判据 · 确认不了时：回滚，还是待重启</text>
  </g>
  <g>
    <rect x="56" y="296" width="360" height="168" rx="14" fill="#161b22" stroke="#30363d"/>
    <text class="m" x="76" y="330" font-size="15" fill="#2f81f7">04</text>
    <text class="m" x="112" y="330" font-size="15" fill="#e6edf3">hard paths</text>
    <text class="t" x="76" y="362" font-size="16" font-weight="600" fill="#e6edf3">硬编码宿主布局</text>
    <text class="t" x="76" y="390" font-size="13" fill="#8b949e">app.asar / unpacked / Program Files 逐级猜</text>
    <text class="t" x="76" y="444" font-size="12.5" fill="#3fb950">判据 · grep 路径，看它假设哪种形态</text>
  </g>
  <g>
    <rect x="440" y="296" width="360" height="168" rx="14" fill="#161b22" stroke="#30363d"/>
    <text class="m" x="460" y="330" font-size="15" fill="#2f81f7">05</text>
    <text class="m" x="496" y="330" font-size="15" fill="#e6edf3">unbounded</text>
    <text class="t" x="460" y="362" font-size="16" font-weight="600" fill="#e6edf3">无界增长</text>
    <text class="t" x="460" y="390" font-size="13" fill="#8b949e">有保留期键，却没有一个指向会涨的那张表</text>
    <text class="t" x="460" y="444" font-size="12.5" fill="#3fb950">判据 · 键 → 清理函数 → 目标表，链条断在哪</text>
  </g>
  <g>
    <rect x="824" y="296" width="360" height="168" rx="14" fill="#161b22" stroke="#30363d"/>
    <text class="m" x="844" y="330" font-size="15" fill="#2f81f7">06</text>
    <text class="m" x="880" y="330" font-size="15" fill="#e6edf3">dual truth</text>
    <text class="t" x="844" y="362" font-size="16" font-weight="600" fill="#e6edf3">双真相</text>
    <text class="t" x="844" y="390" font-size="13" fill="#8b949e">手写白名单 vs DEFAULTS，加字段时必然漏</text>
    <text class="t" x="844" y="444" font-size="12.5" fill="#3fb950">判据 · 白名单是从 DEFAULTS 推导的吗</text>
  </g>
</svg>